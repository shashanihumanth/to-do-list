name: Bug report
description: Something is broken, crashes, or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first, and confirm the bug on the latest version."
  - type: textarea
    id: description
    attributes:
      label: "What happened, and what did you expect?"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      description: "Minimal, numbered, copy-pasteable."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "Affected area"
      multiple: true
      options: ["Core model", "Other"]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "OS and version"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / diagnostic output"
      render: shell
