<!doctype html>
<!--
  Minimal demo of the domain model. A dependency-free UI with two views of the
  same document: the flow chart the board is primarily read as, and an outline
  for entering and scanning tasks quickly.

  - Graph — cards as nodes in flow order, edges drawn between them, blocked
    cards distinguished. Read-only; it is where the pipeline is read.
  - List — the outline, in the same flow order, where tasks are added, renamed
    and ticked, and a blocked card is read-only.

  The document is persisted to localStorage on every change and loaded on
  start; Export writes that same JSON out, Import reads one back and replaces
  the document after validating it.

  The palette is pastel-only and lives in design tokens: Auto follows the
  system preference, Light and Dark are remembered across reloads, and the
  choice is applied before the first paint so the wrong theme never flashes.

  Motion is frequency-gated. Adding, completing and deleting a task or card
  happen tens of times a day, so they get the quick budget and read as
  confirmation; connecting cards, a card unblocking and the theme toggle are
  occasional and get the standard budget. Only the nodes a commit actually
  changed move, a keyboard-initiated action never animates, and reduced motion
  keeps the fades while dropping the movement.

  Build once, then serve the repo root (ES modules need HTTP, not file://):

      npx tsc               # emits dist/domain.js and dist/storage.js
      npx serve .          # or: python3 -m http.server 8000
      open http://localhost:8000/demo/
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The theme, applied before the first paint. A module script is deferred,
      so it would paint the default palette first and flash; this classic
      script runs while the head is parsed.

      It owns the rule and the storage key and publishes them as `__theme` for
      the module at the bottom: both halves need the same vocabulary, and only
      a classic script can run this early, so the definition lives here once
      rather than being written twice.
    -->
    <script>
      window.__theme = (function () {
        var KEY = "to-do-list/theme";
        var systemDark = function () {
          return window.matchMedia("(prefers-color-scheme: dark)").matches;
        };
        return {
          key: KEY,
          /* The saved choice, or null when there is none or storage is unreadable. */
          read: function () {
            try {
              return localStorage.getItem(KEY);
            } catch (error) {
              return null;
            }
          },
          /* What a stored string means: "light", "dark", or "system". */
          preference: function (saved) {
            return saved === "light" || saved === "dark" ? saved : "system";
          },
          /* The palette to render: a manual choice wins, otherwise the system. */
          resolve: function (preference) {
            return preference === "system" ? (systemDark() ? "dark" : "light") : preference;
          },
        };
      })();
      document.documentElement.dataset.theme = window.__theme.resolve(
        window.__theme.preference(window.__theme.read())
      );
    </script>
    <title>To-Do List — demo</title>
    <style>
      /*
        Pastel-only palette, as design tokens. Light is a set of warm pastel
        tints; dark is the same desaturated family pushed to deep shades —
        nothing saturated, nothing pure black or white. Light and dark swap
        these values and nothing else, so the theme is a data-attribute flip.

        Every colour in the page comes from one of these tokens. The pairs that
        carry meaning are checked in both themes: text at WCAG AA (4.5:1), and
        the graphics that carry state — graph edges, node fills and borders,
        badges — at 3:1. Borders and chips are decoration, below that bar.
      */
      :root {
        color-scheme: light;
        --bg: #faf7f4;
        --card: #fffdfa;
        --ink: #322f2b;
        --muted: #6f6a62;
        --line: #ece6de;
        --flow: #948a7b;
        --accent: #bfe0d3;
        --accent-ink: #20493d;
        --accent-soft: #e9f5f0;
        --accent-strong: #2e6b5a;
        --accent-line: #559881;
        --danger: #a8453b;
        --danger-soft: #fbeae7;
        --danger-line: #b67469;
        --chip: #f1ece5;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        /* Motion is frequency-gated: actions taken tens of times a day get the
           quick budget, the occasional ones the standard one. */
        --dur-quick: 140ms;
        --dur-standard: 220ms;
        --dur-view: 180ms;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1d1b19;
        --card: #2a2724;
        --ink: #f1ece5;
        --muted: #b0a99f;
        --line: #3e3a35;
        --flow: #777168;
        --accent: #2f5c4e;
        --accent-ink: #d6f0e6;
        --accent-soft: #29443c;
        --accent-strong: #a5d8c6;
        --accent-line: #6fae99;
        --danger: #e8a79e;
        --danger-soft: #46302d;
        --danger-line: #a87a70;
        --chip: #35312d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
      /* The global controls sit together at the end of the toolbar: theme, then view. */
      .toolbar-tail { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-left: auto; }
      .switch {
        display: inline-flex;
        gap: 0.15rem;
        align-self: center;
        padding: 0.2rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
      }
      .switch button {
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        transition: background-color 140ms ease, color 140ms ease;
      }
      .switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
      input {
        font: inherit;
        padding: 0.5rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
      }
      input[type="text"] { flex: 1; }
      input[type="checkbox"] { accent-color: var(--accent-strong); }
      button {
        font: inherit;
        padding: 0.5rem 0.9rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
      }
      :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
      /* Two views, one slot. Only the active view is in flow — the other is
         lifted out and hidden, so a tall outline never stretches the graph.
         On a toggle the outgoing view stays put and fades out under the
         incoming one, which is what makes it a crossfade and not a cut. */
      .view-stack { position: relative; }
      .view {
        position: absolute;
        inset: 0 0 auto 0;
        opacity: 0;
        visibility: hidden;
        transform: translateY(4px);
        transition:
          opacity var(--dur-view) var(--ease-out),
          transform var(--dur-view) var(--ease-out),
          visibility 0s linear var(--dur-view);
      }
      .view.active {
        position: relative;
        opacity: 1;
        visibility: visible;
        transform: none;
        transition:
          opacity var(--dur-view) var(--ease-out),
          transform var(--dur-view) var(--ease-out),
          visibility 0s;
      }
      .view-stack.instant .view { transition: none; }
      @media (prefers-reduced-motion: reduce) {
        .view,
        .view.active {
          transform: none;
          transition: opacity 120ms ease, visibility 0s linear 120ms;
        }
        .view.active { transition: opacity 120ms ease, visibility 0s; }
      }
      /*
        Motion, frequency-gated per the spec. Adding, completing and deleting a
        task or card happen tens of times a day, so they get the quick budget and
        read as confirmation rather than decoration; connecting cards, a card
        unblocking and the theme toggle are occasional and get the standard one
        (the view toggle keeps the 180ms it shipped with). Only opacity and
        transform move — except the edge reveal, where a line draws along its own
        length and has no transform equivalent.

        The cues are classes added to the nodes a commit actually changed, so a
        rebuild that changed nothing moves nothing; a keyboard-initiated action
        adds none of them and lands instantly.
      */
      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
      }
      @keyframes settle {
        from { opacity: 0.55; transform: translateY(2px); }
      }
      @keyframes unblock {
        from { opacity: 0.4; transform: translateY(6px); }
      }
      @keyframes enter-fade { from { opacity: 0; } }
      @keyframes settle-fade { from { opacity: 0.55; } }
      @keyframes unblock-fade { from { opacity: 0.4; } }
      /* `backwards` holds the from-state through the stagger delay and nothing
         after the run: the element's own style is already the end state. */
      .anim-enter { animation: enter var(--dur-quick) var(--ease-out) var(--enter-delay, 0ms) backwards; }
      .anim-settle { animation: settle var(--dur-quick) var(--ease-out) backwards; }
      .anim-unblock { animation: unblock var(--dur-standard) var(--ease-out) backwards; }
      /* Reduced motion keeps the fade that says "something changed" and drops
         the movement. Only the name is swapped, so the budget and the stagger
         cannot drift from the rule above. */
      @media (prefers-reduced-motion: reduce) {
        .anim-enter { animation-name: enter-fade; }
        .anim-settle { animation-name: settle-fade; }
        .anim-unblock { animation-name: unblock-fade; }
      }
      /* The theme swap is a data-attribute flip, not a property to interpolate,
         so its crossfade is the browser's own snapshot transition. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: var(--dur-standard);
        animation-timing-function: var(--ease-out);
      }
      .view-note { margin: 0; color: var(--muted); font-size: 0.85rem; }
      .flow { display: block; max-width: 100%; height: auto; }
      .node rect { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
      .node.blocked rect { fill: var(--danger-soft); stroke: var(--danger-line); stroke-dasharray: 5 4; }
      .node.complete rect { fill: var(--accent-soft); stroke: var(--accent-line); }
      .node-title {
        font: 600 13px system-ui, sans-serif;
        line-height: 18px;
        color: var(--ink);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .node.blocked .node-title { color: var(--muted); }
      .node-status { font: 11px system-ui, sans-serif; fill: var(--muted); }
      .node.blocked .node-status { fill: var(--danger); }
      .edge { fill: none; stroke: var(--flow); stroke-width: 1.5; }
      .edge-head { fill: var(--flow); }
      .cards { display: grid; gap: 1rem; max-width: 40rem; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem 1.25rem;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.75rem;
      }
      .card-head h2 { font-size: 1rem; margin: 0; flex: 1; }
      .badge {
        font-size: 0.75rem;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
      }
      ul.tasks { list-style: none; margin: 0; padding: 0; }
      li { padding: 0.3rem 0; }
      .row { display: flex; align-items: center; gap: 0.5rem; }
      li.done .row label { text-decoration: line-through; color: var(--muted); }
      input[type="checkbox"]:disabled { opacity: 0.5; }
      ul.tasks ul.tasks {
        padding-left: 1.5rem;
        margin-left: 0.4rem;
        border-left: 1px solid var(--line);
      }
      /* The file's small secondary-action button: "+ sub", "rename", "delete". */
      .mini-action {
        font-size: 0.72rem;
        padding: 0.1rem 0.45rem;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      /* Pointer-gated: on a touch screen :hover fires on tap and the label
         would flash on the way to the click. */
      @media (hover: hover) and (pointer: fine) {
        .mini-action:hover { color: var(--ink); }
      }
      .sub-form { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.3rem 0 0.3rem 1.5rem; }
      .sub-form input { flex: 1; }
      .error {
        flex-basis: 100%;
        margin: 0.3rem 0 0;
        color: var(--danger);
        font-size: 0.85rem;
      }
      /* Blocked is marked by tokens, not by an ancestor opacity: dimming the
         card would composite its copy below AA in both themes. The dashed
         rose border matches how the graph draws a blocked node. */
      .card.blocked { border-style: dashed; border-color: var(--danger-line); }
      .card.blocked h2 { color: var(--muted); }
      .badge.blocked { background: var(--danger-soft); color: var(--danger); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .deps {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.7rem;
        padding-top: 0.6rem;
        border-top: 1px dashed var(--line);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .dep {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.15rem 0.35rem 0.15rem 0.6rem;
        border-radius: 999px;
        background: var(--chip);
        color: var(--ink);
      }
      .dep button {
        padding: 0 0.3rem;
        background: transparent;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.2;
      }
      .deps select {
        font: inherit;
        padding: 0.25rem 0.4rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
      }
      .deps .error { margin: 0; }
      .empty { color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>To-Do List — demo</h1>

    <div class="toolbar" id="board-toolbar">
      <input id="new-card" type="text" placeholder="New card title…" />
      <button id="add-card">Add card</button>
      <button id="export" type="button">Export</button>
      <button id="import-button" type="button">Import</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
      <div class="toolbar-tail">
        <div class="switch" id="theme-switch" role="group" aria-label="Theme">
          <button id="theme-auto-btn" type="button" aria-pressed="true">Auto</button>
          <button id="theme-light-btn" type="button" aria-pressed="false">Light</button>
          <button id="theme-dark-btn" type="button" aria-pressed="false">Dark</button>
        </div>
        <div class="switch" role="group" aria-label="View">
          <button id="view-graph-btn" type="button" aria-pressed="true">Graph</button>
          <button id="view-list-btn" type="button" aria-pressed="false">List</button>
        </div>
      </div>
    </div>

    <div class="view-stack" id="view-stack">
      <section class="view active" id="view-graph" aria-label="Flow chart"></section>
      <section class="view" id="view-list" aria-label="Outline">
        <div class="cards" id="cards"></div>
      </section>
    </div>

    <script type="module">
      import {
        addCard,
        addEdge,
        addTask,
        blockedSet,
        createDocument,
        deleteCard,
        deleteTask,
        isCardBlocked,
        isCardComplete,
        isTaskComplete,
        removeEdge,
        renameCard,
        renameTask,
        reorderTasks,
        reorderSubTasks,
        toggleTaskComplete,
        topologicalOrder,
      } from "../dist/domain.js";
      import { deserializeDocument, serializeDocument } from "../dist/storage.js";

      const cardsEl = document.getElementById("cards");
      const graphEl = document.getElementById("view-graph");
      const newCardInput = document.getElementById("new-card");
      const viewStack = document.getElementById("view-stack");
      const toolbar = document.getElementById("board-toolbar");
      const importFile = document.getElementById("import-file");

      /**
       * Keyboard-initiated actions get no animation at all — the spec makes that
       * a disqualifier, not a judgment call. The last input modality decides,
       * because a checkbox's `change` event carries no pointer detail of its own.
       */
      let keyboardInitiated = false;
      document.addEventListener("keydown", () => { keyboardInitiated = true; }, true);
      document.addEventListener("pointerdown", () => { keyboardInitiated = false; }, true);
      const motionAllowed = () => !keyboardInitiated;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      /** A motion token, so the script's half uses the same curve and budgets as the CSS half. */
      const motionToken = (name) =>
        getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const EASE_OUT = motionToken("--ease-out");
      const QUICK_MS = Number.parseFloat(motionToken("--dur-quick"));
      const STANDARD_MS = Number.parseFloat(motionToken("--dur-standard"));

      /**
       * The storage adapter: the only place browser storage is touched. The
       * document and its JSON text come from the domain and storage modules;
       * this carries the text there and back.
       */
      const STORAGE_KEY = "to-do-list/document";

      /** Persist the current document; a storage failure is surfaced, never silent. */
      function saveDocument() {
        try {
          localStorage.setItem(STORAGE_KEY, serializeDocument(doc));
        } catch {
          showError(toolbar, "This browser would not save the board — changes may be lost.");
        }
      }

      /** The document as last saved, or an empty one with the reason it could not be read. */
      function loadDocument() {
        let saved;
        try {
          saved = localStorage.getItem(STORAGE_KEY);
        } catch {
          return { doc: createDocument(), error: "This browser blocks local storage, so the board will not persist." };
        }
        if (saved === null) return { doc: createDocument(), error: null };
        const result = deserializeDocument(saved);
        if (result.ok) return { doc: result.value, error: null };
        return { doc: createDocument(), error: "The saved board could not be read — starting empty." };
      }

      const restored = loadDocument();
      let doc = restored.doc;
      /** The document the DOM was last rendered from — the yardstick for "what changed". */
      let rendered = doc;

      /** Adopt `next` as the document and persist it; the caller decides when to render. */
      function adopt(next) {
        doc = next;
        clearError(toolbar);
        saveDocument();
      }

      /**
       * Re-render against the last rendered state, so motion lands on everything
       * that changed since the DOM was last built — including a change whose own
       * render was held back for an exit. A keyboard-initiated action moves nothing.
       */
      function renderNow(animate) {
        const cues = animate && motionAllowed() ? changesBetween(rendered, doc) : null;
        rendered = doc;
        render(cues);
      }

      /** Adopt a new document and re-render: the one write path. */
      function commit(next, animate = true) {
        flushExit();
        adopt(next);
        renderNow(animate);
      }

      const VIEWS = [
        { name: "graph", el: graphEl, button: document.getElementById("view-graph-btn") },
        { name: "list", el: document.getElementById("view-list"), button: document.getElementById("view-list-btn") },
      ];
      let view = "graph";
      /** Edges that entered while the graph was hidden, waiting to be drawn. */
      let undrawnEdges = new Set();

      /**
       * Show one view and hide the other. The two crossfade; a toggle from the
       * keyboard swaps instantly, because keyboard actions get no animation.
       */
      function setView(name, animate = true) {
        if (name === view) return;
        view = name;
        if (!animate) viewStack.classList.add("instant");
        for (const entry of VIEWS) {
          const active = entry.name === name;
          entry.el.classList.toggle("active", active);
          entry.button.setAttribute("aria-pressed", String(active));
        }
        if (!animate) {
          void viewStack.offsetWidth; // let the swap settle before transitions return
          viewStack.classList.remove("instant");
        }
        // An edge held while the graph was hidden draws now — unless the switch
        // itself was keyboard-initiated, in which case it is already in place.
        if (name === "graph" && undrawnEdges.size > 0) {
          const edges = undrawnEdges;
          undrawnEdges = new Set();
          if (animate) renderGraph(edgeCues(edges));
        }
      }

      for (const entry of VIEWS) {
        entry.button.addEventListener("click", () => setView(entry.name, motionAllowed()));
      }

      // The rule and the storage key live in the <head> bootstrap (window.__theme),
      // so the pre-paint and the interactive halves cannot drift.
      const themeRule = window.__theme;
      const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
      const THEMES = [
        { preference: "system", button: document.getElementById("theme-auto-btn") },
        { preference: "light", button: document.getElementById("theme-light-btn") },
        { preference: "dark", button: document.getElementById("theme-dark-btn") },
      ];

      let themePreference = themeRule.preference(themeRule.read());

      /**
       * Apply the theme: a manual choice wins, otherwise the system preference.
       * The bootstrap already did this before the first paint; this keeps it in
       * step once the page is interactive, and while Auto is chosen.
       */
      function applyTheme() {
        document.documentElement.dataset.theme = themeRule.resolve(themePreference);
        for (const entry of THEMES) {
          entry.button.setAttribute("aria-pressed", String(entry.preference === themePreference));
        }
      }

      /** Choose a theme and remember it; Auto clears the saved choice. */
      function setTheme(preference, animate = true) {
        if (preference === themePreference) return; // re-picking the active theme is a no-op
        themePreference = preference;
        try {
          if (preference === "system") localStorage.removeItem(themeRule.key);
          else localStorage.setItem(themeRule.key, preference);
        } catch {
          showError(toolbar, "This browser would not remember the theme choice.");
        }
        // The swap is a data-attribute flip, so its crossfade is the browser's
        // snapshot transition. A keyboard choice and reduced motion swap instantly.
        if (animate && motionAllowed() && !reduceMotion.matches && document.startViewTransition) {
          document.startViewTransition(applyTheme);
          return;
        }
        applyTheme();
      }

      for (const entry of THEMES) {
        entry.button.addEventListener("click", () => setTheme(entry.preference));
      }

      // While Auto is chosen, the system preference can change under us.
      darkQuery.addEventListener("change", () => {
        if (themePreference === "system") applyTheme();
      });

      applyTheme();

      /** Replace any inline rejection in `container` with `message`. */
      function showError(container, message, afterNode) {
        clearError(container);
        const el = document.createElement("p");
        el.className = "error";
        el.setAttribute("role", "alert");
        el.textContent = message;
        container.insertBefore(el, afterNode ? afterNode.nextSibling : null);
      }

      /** Drop the inline rejection in `container`, if any. */
      function clearError(container) {
        container.querySelector(":scope > .error")?.remove();
      }

      /** Human wording for each domain rejection the demo can trigger. */
      const REJECTION_MESSAGES = {
        "duplicate-title": "Another task here already has that name.",
        "card-blocked": "This card is blocked until its prerequisite completes.",
        cycle: "That connection would create a cycle.",
        "duplicate-edge": "Those cards are already connected.",
        "edge-not-found": "That connection no longer exists.",
        "card-has-dependents": "Another card still waits on this one.",
      };

      /** Human wording for each reason a file cannot be imported. */
      const IMPORT_MESSAGES = {
        "invalid-json": "That file is not valid JSON.",
        "unsupported-version": "That board was saved by a different version of this app.",
        "malformed-document": "That file is not a board this app can read.",
      };

      /**
       * Surface a rejected command inline, next to the control that triggered
       * it — never silently dropped, never a blocking alert().
       */
      function showRejection(container, result, afterNode) {
        const message =
          REJECTION_MESSAGES[result.error] ?? `Could not apply that change: ${result.error}.`;
        showError(container, message, afterNode);
      }

      /** Apply a command's result: re-render on success, otherwise surface the rejection. */
      function applyResult(result, container, afterNode) {
        if (result.ok) {
          commit(result.value);
          return;
        }
        showRejection(container, result, afterNode);
      }

      /**
       * A removal adopts the deletion at once — state and storage never wait on a
       * frame — and holds back only the re-render, so the row can leave first. Any
       * other commit cuts the exit short and renders at once, so a row that is
       * already deleted cannot linger, and a reload mid-exit cannot resurrect it.
       */
      let exiting = null;

      /** Cut an in-flight exit short; the render that follows removes its row anyway. */
      function flushExit() {
        if (exiting === null) return;
        exiting.cancel();
        exiting = null;
      }

      /** Apply a removal: on success the row leaves first — unless it must not move. */
      function scheduleRemoval(apply, container, node) {
        const result = apply(doc);
        if (!result.ok) {
          showRejection(container, result);
          return;
        }
        adopt(result.value);
        if (!motionAllowed()) {
          renderNow(false);
          return;
        }
        const frames = reduceMotion.matches
          ? [{ opacity: 1 }, { opacity: 0 }]
          : [
              { opacity: 1, transform: "translateY(0)" },
              { opacity: 0, transform: "translateY(8px)" },
            ];
        const animation = node.animate(frames, {
          duration: QUICK_MS,
          easing: EASE_OUT,
          fill: "forwards",
        });
        node.style.pointerEvents = "none"; // the row is leaving; nothing on it should fire again
        exiting = animation;
        animation.finished.then(() => {
          if (exiting !== animation) return;
          exiting = null;
          renderNow(true);
        }, () => {});
      }

      /** Every task in a document, by id — the unit a change is measured in. */
      function tasksById(source) {
        const byId = new Map();
        const walk = (tasks) => {
          for (const task of tasks) {
            byId.set(task.id, task);
            walk(task.subtasks);
          }
        };
        for (const card of source.cards) walk(card.tasks);
        return byId;
      }

      /** The identity of an edge, which has no id of its own. */
      const edgeKey = (edge) => `${edge.prerequisiteId}->${edge.dependentId}`;

      /** A cue set carrying nothing but the given new edges. */
      const edgeCues = (edges) => ({ entering: new Set(), toggled: new Set(), unblocked: new Set(), edges });

      /**
       * What changed between two documents, by id: the only nodes that may move.
       * Every render rebuilds both views, so without this each rebuild would
       * replay every entrance; with it, motion lands on the change alone.
       */
      function changesBetween(before, after) {
        const beforeCards = new Set(before.cards.map((card) => card.id));
        const beforeTasks = tasksById(before);
        const beforeEdges = new Set(before.edges.map(edgeKey));
        const wasBlocked = blockedSet(before);
        const isBlocked = blockedSet(after);

        const entering = new Set();
        for (const card of after.cards) {
          if (!beforeCards.has(card.id)) entering.add(card.id);
        }
        const toggled = new Set();
        for (const [id, task] of tasksById(after)) {
          const previous = beforeTasks.get(id);
          if (previous === undefined) entering.add(id);
          // Either direction: the spec gives complete and uncomplete the same
          // near-imperceptible feedback.
          else if (isTaskComplete(previous) !== isTaskComplete(task)) toggled.add(id);
        }
        const unblocked = new Set();
        for (const card of after.cards) {
          if (beforeCards.has(card.id) && wasBlocked.has(card.id) && !isBlocked.has(card.id)) {
            unblocked.add(card.id);
          }
        }
        const edges = new Set();
        for (const edge of after.edges) {
          const key = edgeKey(edge);
          if (!beforeEdges.has(key)) edges.add(key);
        }
        return { entering, toggled, unblocked, edges };
      }

      /** 45ms between entering siblings, capped so a large import doesn't crawl. */
      const staggerDelay = (index) => Math.min(index, 5) * 45;
      let enterStep = 0;
      const nextEnterDelay = () => staggerDelay(enterStep++);

      /** Mark a node as entering, at its place in the stagger. */
      function markEntering(el) {
        el.classList.add("anim-enter");
        el.style.setProperty("--enter-delay", `${nextEnterDelay()}ms`);
      }

      /** Render both views; the toggle only decides which one is visible. */
      function render(cues) {
        renderList(cues);
        renderGraph(cues);
      }

      function emptyMessage() {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No cards yet — add one above.";
        return empty;
      }

      /** The outline: every card in flow order, each with its tasks indented. */
      function renderList(cues) {
        enterStep = 0;
        cardsEl.replaceChildren();
        if (doc.cards.length === 0) {
          cardsEl.appendChild(emptyMessage());
          return;
        }
        if (doc.edges.length > 0) {
          const note = document.createElement("p");
          note.className = "view-note";
          note.textContent = "In flow order — a card waits for the cards above it.";
          cardsEl.appendChild(note);
        }
        const byId = new Map(doc.cards.map((c) => [c.id, c]));
        for (const id of topologicalOrder(doc)) {
          const card = byId.get(id);
          if (card !== undefined) cardsEl.appendChild(renderCard(card, cues));
        }
      }

      const SVG_NS = "http://www.w3.org/2000/svg";
      const XHTML_NS = "http://www.w3.org/1999/xhtml";
      const NODE_W = 168;
      const NODE_H = 60;
      const GAP_X = 72;
      const GAP_Y = 28;
      const PAD = 8;

      /**
       * The flow chart: each card a node, each edge drawn between them. Nodes
       * sit in layers, a card one column right of its latest prerequisite, so
       * every edge points forwards.
       */
      function renderGraph(cues) {
        enterStep = 0;
        graphEl.replaceChildren();
        if (doc.cards.length === 0) {
          graphEl.appendChild(emptyMessage());
          return;
        }

        const byId = new Map(doc.cards.map((c) => [c.id, c]));
        const blocked = blockedSet(doc);
        const ids = topologicalOrder(doc);
        const layerOf = new Map();
        const rowOf = new Map();
        const rows = [];

        for (const id of ids) {
          // `ids` is topological, so every prerequisite's layer is already known.
          let layer = 0;
          for (const edge of doc.edges) {
            if (edge.dependentId !== id) continue;
            const from = layerOf.get(edge.prerequisiteId);
            if (from !== undefined) layer = Math.max(layer, from + 1);
          }
          const row = rows[layer] ?? 0;
          rows[layer] = row + 1;
          layerOf.set(id, layer);
          rowOf.set(id, row);
        }

        const width = rows.length * (NODE_W + GAP_X) - GAP_X + PAD * 2;
        const tallest = rows.reduce((max, count) => Math.max(max, count ?? 0), 1);
        const height = tallest * (NODE_H + GAP_Y) - GAP_Y + PAD * 2;
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("class", "flow");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("width", String(width));
        svg.setAttribute("height", String(height));
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", `Flow chart: ${doc.cards.length} cards, ${doc.edges.length} edges`);
        svg.appendChild(edgeMarker());

        const drawing = [];
        for (const edge of doc.edges) {
          const path = edgePath(edge, layerOf, rowOf);
          if (path === null) continue;
          svg.appendChild(path);
          const key = edgeKey(edge);
          if (cues !== null && cues.edges.has(key)) drawing.push({ path, key });
        }
        for (const id of ids) {
          const card = byId.get(id);
          if (card === undefined) continue;
          const entering = cues !== null && cues.entering.has(id);
          svg.appendChild(graphNode(card, layerOf.get(id), rowOf.get(id), blocked.has(id), entering));
        }

        graphEl.appendChild(svg);
        // Drawn after insertion: a path must be in the document to be measured.
        // Connecting happens in the list view, so an edge that enters while the
        // graph is hidden is held back until the graph is looked at. The lengths
        // are all read before any style is written, so one recalculation covers
        // the batch instead of one per edge.
        if (view === "graph") {
          const lengths = drawing.map(({ path }) => path.getTotalLength());
          drawing.forEach(({ path }, index) => drawEdge(path, lengths[index], staggerDelay(index)));
        } else {
          for (const { key } of drawing) undrawnEdges.add(key);
        }
      }

      /** The marker every edge ends in. */
      function edgeMarker() {
        const defs = document.createElementNS(SVG_NS, "defs");
        const marker = document.createElementNS(SVG_NS, "marker");
        marker.setAttribute("id", "edge-marker");
        marker.setAttribute("markerWidth", "8");
        marker.setAttribute("markerHeight", "8");
        marker.setAttribute("refX", "7");
        marker.setAttribute("refY", "4");
        marker.setAttribute("orient", "auto");
        const tip = document.createElementNS(SVG_NS, "path");
        tip.setAttribute("class", "edge-head");
        tip.setAttribute("d", "M0,0 L8,4 L0,8 z");
        marker.appendChild(tip);
        defs.appendChild(marker);
        return defs;
      }

      /** The path for an edge, curving from a prerequisite's right edge to its dependent's left. */
      function edgePath(edge, layerOf, rowOf) {
        const from = layerOf.get(edge.prerequisiteId);
        const to = layerOf.get(edge.dependentId);
        if (from === undefined || to === undefined) return null;
        const x1 = PAD + from * (NODE_W + GAP_X) + NODE_W;
        const y1 = PAD + rowOf.get(edge.prerequisiteId) * (NODE_H + GAP_Y) + NODE_H / 2;
        const x2 = PAD + to * (NODE_W + GAP_X);
        const y2 = PAD + rowOf.get(edge.dependentId) * (NODE_H + GAP_Y) + NODE_H / 2;
        const bend = Math.max((x2 - x1) / 2, 20);
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("class", "edge");
        path.setAttribute("d", `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`);
        path.setAttribute("marker-end", "url(#edge-marker)");
        return path;
      }

      /**
       * Draw a new edge in: the line reveals along its own length. A line has no
       * transform that reads as "drawing", so this is the one paint property in
       * the file — dash offset, which costs no layout. Reduced motion swaps the
       * reveal for a fade.
       */
      function drawEdge(path, length, delay) {
        if (reduceMotion.matches) {
          path.animate([{ opacity: 0 }, { opacity: 1 }], {
            duration: QUICK_MS,
            delay,
            easing: EASE_OUT,
          });
          return;
        }
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
        const draw = path.animate(
          [{ strokeDashoffset: String(length) }, { strokeDashoffset: "0" }],
          { duration: STANDARD_MS, delay, easing: EASE_OUT },
        );
        // Restore the undashed line whether the draw lands or is cut short — a
        // cancelled draw would otherwise leave the edge dashed out of sight.
        const restore = () => {
          path.style.strokeDasharray = "";
          path.style.strokeDashoffset = "";
        };
        draw.finished.then(restore, restore);
      }

      /** One card as a node: title and progress, styled by its derived state. */
      function graphNode(card, layer, row, isBlocked, entering) {
        const node = document.createElementNS(SVG_NS, "g");
        node.setAttribute("class", `node ${cardState(isBlocked, isCardComplete(card))}`);
        node.setAttribute(
          "transform",
          `translate(${PAD + layer * (NODE_W + GAP_X)}, ${PAD + row * (NODE_H + GAP_Y)})`,
        );

        // The full title survives on hover even when the node is too narrow for it.
        const full = document.createElementNS(SVG_NS, "title");
        full.textContent = card.title;
        node.appendChild(full);

        // The body carries the entrance, so moving it cannot disturb the node's
        // own positioning transform.
        const body = document.createElementNS(SVG_NS, "g");
        if (entering) markEntering(body);

        const box = document.createElementNS(SVG_NS, "rect");
        box.setAttribute("width", String(NODE_W));
        box.setAttribute("height", String(NODE_H));
        box.setAttribute("rx", "12");
        body.appendChild(box);

        // HTML inside the node lets the browser measure the title itself, so it
        // ellipsizes cleanly whatever the glyphs — and the full title stays on
        // hover via the <title> above.
        const titleBox = document.createElementNS(SVG_NS, "foreignObject");
        titleBox.setAttribute("x", "12");
        titleBox.setAttribute("y", "13");
        titleBox.setAttribute("width", String(NODE_W - 24));
        titleBox.setAttribute("height", "18");
        const title = document.createElementNS(XHTML_NS, "div");
        title.setAttribute("class", "node-title");
        title.textContent = card.title;
        titleBox.appendChild(title);
        body.appendChild(titleBox);

        const status = document.createElementNS(SVG_NS, "text");
        status.setAttribute("class", "node-status");
        status.setAttribute("x", "14");
        status.setAttribute("y", "45");
        status.textContent = isBlocked ? "Blocked" : cardStatus(card);
        body.appendChild(status);

        node.appendChild(body);
        return node;
      }

      /** The state a card is rendered in — blocked wins over complete. */
      function cardState(isBlocked, isComplete) {
        if (isBlocked) return "blocked";
        return isComplete ? "complete" : "open";
      }

      /** A card's one-line status for its node. */
      function cardStatus(card) {
        if (card.tasks.length === 0) return "No tasks";
        const done = card.tasks.filter(isTaskComplete).length;
        return done === card.tasks.length ? "Complete" : `${done}/${card.tasks.length} tasks`;
      }

      function renderCard(card, cues) {
        const el = document.createElement("section");
        const state = cardState(isCardBlocked(doc, card.id), isCardComplete(card));
        const blocked = state === "blocked";
        el.className = blocked ? "card blocked" : "card";
        if (cues !== null && cues.entering.has(card.id)) {
          markEntering(el);
        } else if (cues !== null && cues.unblocked.has(card.id)) {
          el.classList.add("anim-unblock");
        }

        const head = document.createElement("div");
        head.className = "card-head";
        const title = document.createElement("h2");
        title.textContent = card.title;
        head.appendChild(title);
        if (state === "blocked") {
          const badge = document.createElement("span");
          badge.className = "badge blocked";
          badge.textContent = "Blocked";
          head.appendChild(badge);
        } else if (state === "complete") {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "Complete";
          head.appendChild(badge);
        }
        // Renaming is editing the card, so it locks with everything else while
        // the card is blocked.
        const renameCardButton = document.createElement("button");
        renameCardButton.type = "button";
        renameCardButton.className = "mini-action";
        renameCardButton.textContent = "rename";
        renameCardButton.title = "Rename this card";
        renameCardButton.disabled = blocked;
        renameCardButton.addEventListener("click", () => startRenameCard(title, card, el, head));
        head.appendChild(renameCardButton);
        const removeCard = document.createElement("button");
        removeCard.type = "button";
        removeCard.className = "mini-action";
        removeCard.textContent = "delete";
        removeCard.title = "Delete this card and its tasks";
        removeCard.disabled = blocked;
        removeCard.addEventListener("click", () =>
          scheduleRemoval((d) => deleteCard(d, card.id), el, el),
        );
        head.appendChild(removeCard);

        el.appendChild(head);

        if (blocked) {
          const note = document.createElement("p");
          note.className = "empty";
          note.textContent = "Read-only until its prerequisite completes.";
          el.appendChild(note);
        }

        const list = document.createElement("ul");
        list.className = "tasks";
        for (const [index, task] of card.tasks.entries()) {
          list.appendChild(
            renderTask(task, card.id, blocked, cues, {
              siblings: card.tasks,
              index,
              reorder: (ids) => reorderTasks(doc, card.id, ids),
            }),
          );
        }
        el.appendChild(list);

        const add = document.createElement("div");
        add.className = "toolbar";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "New task…";
        input.disabled = blocked;
        input.addEventListener("input", () => clearError(el));
        // Enter is the fast path: one field, no modal, no confirmation.
        const submitTask = () => {
          if (input.value.trim() === "") return;
          applyResult(addTask(doc, card.id, input.value), el, add);
        };
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") submitTask();
        });
        const button = document.createElement("button");
        button.textContent = "Add task";
        button.disabled = blocked;
        button.addEventListener("click", submitTask);
        add.append(input, button);
        el.appendChild(add);

        el.appendChild(renderDeps(card));

        return el;
      }

      /** Render a card's prerequisites, plus a control to connect another card to it. */
      function renderDeps(card) {
        const el = document.createElement("div");
        el.className = "deps";

        const label = document.createElement("span");
        label.textContent = "Blocked by:";
        el.appendChild(label);

        for (const edge of doc.edges.filter((e) => e.dependentId === card.id)) {
          const prerequisite = doc.cards.find((c) => c.id === edge.prerequisiteId);
          const chip = document.createElement("span");
          chip.className = "dep";
          const name = document.createElement("span");
          name.textContent = prerequisite ? prerequisite.title : "unknown";
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "×";
          remove.title = "Remove this prerequisite";
          remove.addEventListener("click", () => applyResult(removeEdge(doc, edge.prerequisiteId, card.id), el));
          chip.append(name, remove);
          el.appendChild(chip);
        }

        const candidates = doc.cards.filter((c) => c.id !== card.id);
        if (candidates.length > 0) {
          const select = document.createElement("select");
          select.title = "Card that must finish first";
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "must finish first…";
          select.appendChild(placeholder);
          for (const candidate of candidates) {
            const option = document.createElement("option");
            option.value = candidate.id;
            option.textContent = candidate.title;
            select.appendChild(option);
          }
          const connect = document.createElement("button");
          connect.type = "button";
          connect.textContent = "Connect";
          connect.addEventListener("click", () => {
            if (select.value === "") return;
            applyResult(addEdge(doc, select.value, card.id), el);
          });
          el.append(select, connect);
        }

        return el;
      }

      function renderTask(task, cardId, blocked, cues, position) {
        const li = document.createElement("li");
        const complete = isTaskComplete(task);
        const isLeaf = task.subtasks.length === 0;
        if (complete) li.classList.add("done");
        if (cues !== null && cues.entering.has(task.id)) {
          markEntering(li);
        } else if (cues !== null && cues.toggled.has(task.id)) {
          li.classList.add("anim-settle");
        }

        const row = document.createElement("div");
        row.className = "row";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = complete;
        // Completion of a parent is derived from its sub-tasks; only leaves
        // toggle, and a blocked card's tasks are all read-only.
        checkbox.disabled = !isLeaf || blocked;
        checkbox.addEventListener("change", () => {
          const result = toggleTaskComplete(doc, task.id);
          if (result.ok) commit(result.value);
        });
        row.appendChild(checkbox);

        const label = document.createElement("label");
        label.textContent = task.title;
        row.appendChild(label);

        const addSub = document.createElement("button");
        addSub.className = "mini-action";
        addSub.textContent = "+ sub";
        addSub.title = "Add a sub-task";
        addSub.disabled = blocked;
        addSub.addEventListener("click", () => appendSubTaskForm(li, cardId, task.id));
        row.appendChild(addSub);

        const renameButton = document.createElement("button");
        renameButton.className = "mini-action";
        renameButton.textContent = "rename";
        renameButton.title = "Rename this task";
        renameButton.disabled = blocked;
        renameButton.addEventListener("click", () => startRename(label, task));
        row.appendChild(renameButton);

        // Reordering is offered on any list of siblings with more than one item,
        // through the parent's reorder command (card-level or sub-task-level).
        if (position !== undefined && position.siblings.length > 1) {
          const { siblings, index, reorder } = position;
          const moveTo = (target) => {
            const ids = siblings.map((t) => t.id);
            [ids[index], ids[target]] = [ids[target], ids[index]];
            applyResult(reorder(ids), row);
          };
          const up = document.createElement("button");
          up.type = "button";
          up.className = "mini-action";
          up.textContent = "↑";
          up.title = "Move up";
          up.disabled = blocked || index === 0;
          up.addEventListener("click", () => moveTo(index - 1));
          const down = document.createElement("button");
          down.type = "button";
          down.className = "mini-action";
          down.textContent = "↓";
          down.title = "Move down";
          down.disabled = blocked || index === siblings.length - 1;
          down.addEventListener("click", () => moveTo(index + 1));
          row.append(up, down);
        }

        const removeTask = document.createElement("button");
        removeTask.type = "button";
        removeTask.className = "mini-action";
        removeTask.textContent = "delete";
        removeTask.title = "Delete this task and its sub-tasks";
        removeTask.disabled = blocked;
        removeTask.addEventListener("click", () =>
          scheduleRemoval((d) => deleteTask(d, task.id), li, li),
        );
        row.appendChild(removeTask);

        li.appendChild(row);

        if (task.subtasks.length > 0) {
          const children = document.createElement("ul");
          children.className = "tasks";
          for (const [childIndex, child] of task.subtasks.entries()) {
            children.appendChild(
              renderTask(child, cardId, blocked, cues, {
                siblings: task.subtasks,
                index: childIndex,
                reorder: (ids) => reorderSubTasks(doc, task.id, ids),
              }),
            );
          }
          li.appendChild(children);
        }

        return li;
      }

      /** Swap a task's label for an input; Enter renames, Escape or blur cancels. */
      function startRename(label, task) {
        const li = label.closest("li");
        const row = label.closest(".row");
        const input = document.createElement("input");
        input.type = "text";
        input.value = task.title;
        label.replaceWith(input);
        input.focus();
        input.select();

        const cancel = () => {
          input.replaceWith(label);
          clearError(li);
        };
        input.addEventListener("input", () => clearError(li));
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            if (input.value.trim() === "") return;
            applyResult(renameTask(doc, task.id, input.value), li, row);
          }
          if (event.key === "Escape") cancel();
        });
        input.addEventListener("blur", cancel);
      }

      /** Swap a card's title for an input; Enter renames, Escape or blur cancels. */
      function startRenameCard(titleEl, card, container, afterNode) {
        const input = document.createElement("input");
        input.type = "text";
        input.value = card.title;
        titleEl.replaceWith(input);
        input.focus();
        input.select();

        const cancel = () => {
          input.replaceWith(titleEl);
          clearError(container);
        };
        input.addEventListener("input", () => clearError(container));
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            if (input.value.trim() === "") return;
            applyResult(renameCard(doc, card.id, input.value), container, afterNode);
          }
          if (event.key === "Escape") cancel();
        });
        input.addEventListener("blur", cancel);
      }

      function appendSubTaskForm(li, cardId, parentId) {
        const form = document.createElement("div");
        form.className = "sub-form";

        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Sub-task title…";
        input.addEventListener("input", () => clearError(form));

        const submit = () => {
          if (input.value.trim() === "") return;
          applyResult(addTask(doc, cardId, input.value, parentId), form);
        };

        const button = document.createElement("button");
        button.textContent = "Add";
        button.addEventListener("click", submit);
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") submit();
        });

        form.append(input, button);
        li.appendChild(form);
        input.focus();
      }

      // Card entry gets the same fast path as task entry: type, then Enter.
      const submitCard = () => {
        const title = newCardInput.value;
        if (title.trim() === "") return;
        const result = addCard(doc, title);
        if (result.ok) {
          commit(result.value);
          newCardInput.value = "";
        }
      };
      document.getElementById("add-card").addEventListener("click", submitCard);
      newCardInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") submitCard();
      });

      document.getElementById("export").addEventListener("click", () => {
        const blob = new Blob([serializeDocument(doc)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "to-do-list.json";
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById("import-button").addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", async () => {
        const file = importFile.files?.[0];
        if (file === undefined) return;
        const result = deserializeDocument(await file.text());
        importFile.value = ""; // so choosing the same file again fires change
        if (result.ok) commit(result.value);
        else showError(toolbar, IMPORT_MESSAGES[result.error]);
      });

      if (restored.error !== null) showError(toolbar, restored.error);
      render(null);
    </script>
  </body>
</html>
